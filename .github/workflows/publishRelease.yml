name: publish release

on:
  issues:
    types:
      - labeled

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  NPM_CONFIG_BEFORE: ''
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: '10080' # minutes (7 days)

jobs:
  publish_release:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'release candidate') && github.event.label.name == 'approve release'
    runs-on: ubuntu-latest
    env:
      CHANGELOG_PATH: /tmp/CHANGELOG.md
      IS_PRERELEASE: ${{ contains(github.event.issue.labels.*.name, 'prerelease') }}
    steps:
      - name: Set NPM_CONFIG_BEFORE
        run: |
          echo "NPM_CONFIG_BEFORE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          ref: release-candidate
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: git config
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - run: pnpm install --frozen-lockfile
        # Ensure npm 11.5.1 or later is installed for OICD.
      - run: |
          npm install -g npm@latest
          echo "Updated npm version: $(npm -v)"
      - run: pnpm release
        if: ${{ env.IS_PRERELEASE == 'false' }}
      - run: pnpm release --prerelease
        if: ${{ env.IS_PRERELEASE == 'true' }}
        # pnpm-workspace.yaml の ignoreScripts: true により publish 時の prepublishOnly が
        # スキップされるため、ビルド成果物 lib/ を明示的に生成する
      - run: pnpm build
      - name: verify build artifacts
        run: test -f lib/index.js
      - run: pnpm publish --publish-branch release-candidate
        if: ${{ env.IS_PRERELEASE == 'false' }}
      - run: pnpm publish --tag prerelease --publish-branch release-candidate
        if: ${{ env.IS_PRERELEASE == 'true' }}
      - run: echo NEW_TAG=$(git describe) >> $GITHUB_ENV
      - run: git push origin $NEW_TAG
      - run: pnpm dlx ts-node ./scripts/getLatestChangelog.ts > ${{ env.CHANGELOG_PATH }}
      - name: create release on GitHub
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.NEW_TAG }}
          release_name: ${{ env.NEW_TAG }}
          body_path: ${{ env.CHANGELOG_PATH }}
          commitish: main
          prerelease: ${{ env.IS_PRERELEASE }}
      - name: close issue
        uses: peter-evans/close-issue@v3.0.2
      - name: delete branch
        run: git push origin :release-candidate
      - name: cherry-pick release commit
        run: |
          git checkout main
          git cherry-pick $NEW_TAG
      - name: craete pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          title: 'chore(release): ${{ env.NEW_TAG }}'
          branch: 'merge-release-${{ env.NEW_TAG }}'
