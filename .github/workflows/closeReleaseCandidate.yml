name: close release candidate

on:
  issues:
    types:
      - closed

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  NPM_CONFIG_BEFORE: ''
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: '10080' # minutes (7 days)

jobs:
  close_release_candidate:
    if: contains(github.event.issue.labels.*.name, 'release candidate')
    runs-on: ubuntu-latest
    steps:
      - name: Set NPM_CONFIG_BEFORE
        run: |
          echo "NPM_CONFIG_BEFORE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: delete branch
        run: git push origin :release-candidate
